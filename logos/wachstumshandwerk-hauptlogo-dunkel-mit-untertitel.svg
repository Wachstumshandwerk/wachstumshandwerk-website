<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-labelledby="title desc">
  <title id="title">Wachstumshandwerk Logo mit Untertitel</title>
  <desc id="desc">Hauptversion mit Untertitel „Vertriebspartner mit Handwerksverstand"</desc>
  <rect x="0" y="0" width="480" height="150" rx="14" fill="#1B4332"/>
  <text x="28" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="32" letter-spacing="1">
    <tspan font-weight="350" fill="#F8F6F1">WACH</tspan><tspan font-weight="500" fill="#F8F6F1">STUM</tspan><tspan font-weight="650" fill="#F8F6F1">SHAN</tspan><tspan font-weight="750" fill="#F8F6F1">DWER</tspan><tspan font-weight="800" fill="#52B788">K</tspan>
  </text>
  <line x1="28" y1="88" x2="68" y2="88" stroke="#52B788" stroke-width="3" stroke-linecap="round"/>
  <text x="28" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#F8F6F1" opacity="0.8">VERTRIEBSPARTNER MIT HANDWERKSVERSTAND</text>
</svg>
